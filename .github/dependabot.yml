{
  "version": 2,
  "updates":
    [
      {
        "package-ecosystem": "npm",
        "directory": "/",
        "schedule": { "interval": "weekly", "day": "monday" },
        "groups":
          {
            "production-dependencies":
              {
                "patterns": ["*"],
                "exclude-patterns":
                  [
                    "@types/*",
                    "typescript",
                    "vitest*",
                    "@vitest/*",
                    "playwright*",
                    "@playwright/*",
                    "storybook*",
                    "@storybook/*",
                    "oxlint",
                    "oxfmt",
                  ],
              },
            "dev-dependencies":
              {
                "patterns":
                  [
                    "@types/*",
                    "typescript",
                    "vitest*",
                    "@vitest/*",
                    "playwright*",
                    "@playwright/*",
                    "storybook*",
                    "@storybook/*",
                    "oxlint",
                    "oxfmt",
                  ],
                "dependency-type": "development",
              },
          },
        "open-pull-requests-limit": 10,
      },
      {
        "package-ecosystem": "github-actions",
        "directory": "/",
        "schedule": { "interval": "weekly" },
      },
    ],
}
